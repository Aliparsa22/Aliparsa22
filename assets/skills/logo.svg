<svg width="600" height="120" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="glitch">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.9"
        numOctaves="1"
        seed="2"
        result="noise"
      />

      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="4"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>

    <clipPath id="slice1">
      <rect x="0" y="35" width="600" height="12"/>
    </clipPath>

    <clipPath id="slice2">
      <rect x="0" y="70" width="600" height="10"/>
    </clipPath>
  </defs>

  <!-- Main text -->
  <text
    x="300"
    y="68"
    text-anchor="middle"
    font-family="monospace"
    font-size="36"
    font-weight="700"
    fill="#ffffff"
  >
    # Hi, I'm Ali Parsa
  </text>

  <!-- Red glitch -->
  <text
    x="296"
    y="68"
    text-anchor="middle"
    font-family="monospace"
    font-size="36"
    font-weight="700"
    fill="#ff003c"
    opacity="0.8"
    clip-path="url(#slice1)"
  >
    # Hi, I'm Ali Parsa
  </text>

  <!-- Cyan glitch -->
  <text
    x="304"
    y="68"
    text-anchor="middle"
    font-family="monospace"
    font-size="36"
    font-weight="700"
    fill="#00e5ff"
    opacity="0.8"
    clip-path="url(#slice2)"
  >
    # Hi, I'm Ali Parsa
  </text>

</svg>